[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nathar-observe"
version = "0.1.0"
description = "Agent-independent context retrieval and explainable skill routing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "networkx>=3,<4"]
keywords = ["agents", "skills", "retrieval", "routing", "rag"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/abuegab1-spec/nathar-observe"

[project.optional-dependencies]
semantic = ["qdrant-client>=1.14,<2", "fastembed>=0.6,<1"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
nathar-observe = "nathar_observe.router:main"
nathar-vault = "nathar_observe.vault:main"
nathar-skills = "nathar_observe.embeddings:main"
nathar-graph = "nathar_observe.graph:main"
nathar-read-skill = "nathar_observe.reader:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/nathar-observe/skills/nathar-observe" = ["skills/nathar-observe/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
